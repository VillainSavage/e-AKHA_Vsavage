<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1628;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

<body>
<div id="loading"><div class="box"><h1>e-AKHA Vsavage</h1><p>Memuatkan aplikasi penuh April/Mei 2026...</p><p>Jangan tutup halaman ini.</p><div id="err"></div></div></div>
<iframe id="app" title="e-AKHA"></iframe>
<script>
(function(){
'use strict';
var SHA='9efd43bf60c565ea44e82e36de7ab45fb0ffc54e';
var API='https://api.github.com/repos/VillainSavage/e-AKHA_Vsavage/git/blobs/'+SHA;
function decode(b64){
  var clean=String(b64||'').replace(/\s+/g,'');
  var bin=atob(clean),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
fetch(API+'?nocache='+Date.now(),{cache:'no-store'})
.then(function(r){if(!r.ok)throw new Error('Gagal fetch aplikasi: '+r.status);return r.json();})
.then(function(blob){
  var html=decode(blob.content||'');
  if(!/^\s*<!DOCTYPE html>/i.test(html))throw new Error('Fail aplikasi tidak lengkap');
  html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>e-AKHA Vsavage v5.10.53 MONTH AWARE</title>');
  var tag='<scr'+'ipt src="v51053-month-loader.js?v=51053-'+Date.now()+'"></scr'+'ipt>';
  html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,tag+'</body>'):html+tag;
  var frame=document.getElementById('app');
  frame.onload=function(){document.getElementById('loading').style.display='none';frame.style.display='block';};
  frame.srcdoc=html;
})
.catch(function(e){
  console.error(e);
  document.getElementById('err').textContent='Gagal load sistem.\n\n'+(e&&e.stack||e);
});
})();
</script>
