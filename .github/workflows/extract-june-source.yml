name: Extract and validate June source

on:
  push:
    branches:
      - agent/june-data-import

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/june-data-import
      - name: Extract readable source files
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, base64, json, pathlib

          out = pathlib.Path('debug-june-source')
          out.mkdir(exist_ok=True)

          def pushed_string(path):
              text = pathlib.Path(path).read_text(encoding='utf-8')
              start = text.index('.push(') + len('.push(')
              raw = text[start:]
              if raw.endswith(';'):
                  raw = raw[:-1]
              if raw.endswith(')'):
                  raw = raw[:-1]
              raw = raw.strip()
              if raw.startswith('"'):
                  return json.loads(raw)
              return ast.literal_eval(raw)

          app = ''.join(pushed_string(f'jun-2026/part{i:02d}.js') for i in range(1, 9))
          (out / 'jun-app-original.js').write_text(app, encoding='utf-8')

          loader_b64 = ''.join(pushed_string(f'jun-2026/loader-b64-{i:02d}.js') for i in range(1, 8))
          loader_patch = base64.b64decode(loader_b64).decode('utf-8')
          (out / 'jun-loader-patch.js').write_text(loader_patch, encoding='utf-8')
          PY

      - name: Build and syntax-check final June application
        shell: bash
        run: |
          cat > /tmp/test-june.js <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          global.window = { __JUN_APP_PARTS__: [], __JUN_LOADER_B64_PARTS__: [] };
          for (let i = 1; i <= 8; i++) vm.runInThisContext(fs.readFileSync(`jun-2026/part${String(i).padStart(2, '0')}.js`, 'utf8'));
          vm.runInThisContext(fs.readFileSync('jun-2026/june-migration-seed-2026.js', 'utf8'));
          vm.runInThisContext(fs.readFileSync('jun-2026/kzk-seed-june-2026.js', 'utf8'));
          for (let i = 1; i <= 7; i++) vm.runInThisContext(fs.readFileSync(`jun-2026/loader-b64-${String(i).padStart(2, '0')}.js`, 'utf8'));
          let patch = Buffer.from(window.__JUN_LOADER_B64_PARTS__.join(''), 'base64').toString('utf8');
          const before = patch;
          patch = patch.replace(/new Function\(code\)\(\);/g, 'globalThis.__JUNE_FINAL_SOURCE__=code;');
          if (patch === before) throw new Error('Loader evaluator marker not found');
          vm.runInThisContext(patch);
          const finalSource = globalThis.__JUNE_FINAL_SOURCE__;
          if (!finalSource) throw new Error('Final June source was not generated');
          new Function(finalSource);
          for (const text of ['SNAPSHOT BOS — JUN 2026','IMPORT_JUNE_LEGACY','JUNE-COMPLETE-20260709-1','Import Backup Lama Jun','MOHD FAHMIE BIN HAMIL dibuang','applyJuneKzkSeed']) {
            if (!finalSource.includes(text)) throw new Error(`Missing final-source marker: ${text}`);
          }
          if (window.__EAKHA_JUNE_KZK_SEED__?.records?.length !== 52) throw new Error('KZ Koperal seed is not 52 members');
          console.log(`Final source OK: ${finalSource.length} chars; KZK members: 52`);
          NODE
          node /tmp/test-june.js

      - name: Validate HTML load order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('jun-2026/index.html').read_text()
          names = ['part08.js', 'june-migration-seed-2026.js', 'loader-b64-01.js', 'loader.js']
          positions = [text.index(name) for name in names]
          assert positions == sorted(positions), (names, positions)
          assert '52 Anggota' in text
          print('HTML load order OK')
          PY

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-june-source
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract readable June app source"
          git push origin HEAD:agent/june-data-import
