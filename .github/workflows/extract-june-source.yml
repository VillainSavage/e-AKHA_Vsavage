name: Extract June source

on:
  push:
    branches:
      - agent/june-data-import

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/june-data-import
      - name: Extract source files
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, base64, json, pathlib, re

          root = pathlib.Path('.')
          out = root / 'debug-june-source'
          out.mkdir(exist_ok=True)

          def pushed_string(path):
              text = pathlib.Path(path).read_text(encoding='utf-8')
              m = re.search(r'\.push\((.*)\);?\s*$', text, re.S)
              if not m:
                  raise RuntimeError(f'Cannot parse {path}')
              raw = m.group(1).strip()
              if raw.startswith('"'):
                  return json.loads(raw)
              return ast.literal_eval(raw)

          app = ''.join(pushed_string(f'jun-2026/part{i:02d}.js') for i in range(1, 9))
          (out / 'jun-app-original.js').write_text(app, encoding='utf-8')

          loader_b64 = ''.join(pushed_string(f'jun-2026/loader-b64-{i:02d}.js') for i in range(1, 8))
          loader_patch = base64.b64decode(loader_b64).decode('utf-8')
          (out / 'jun-loader-patch.js').write_text(loader_patch, encoding='utf-8')
          PY

          cat > /tmp/build-final.js <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          global.window = {
            __JUN_APP_PARTS__: [fs.readFileSync('debug-june-source/jun-app-original.js', 'utf8')]
          };
          vm.runInThisContext(fs.readFileSync('jun-2026/kzk-seed-june-2026.js', 'utf8'));
          let patch = fs.readFileSync('debug-june-source/jun-loader-patch.js', 'utf8');
          const before = patch;
          patch = patch.replace(/new Function\(code\)\(\);/g, 'globalThis.__JUN_FINAL_CODE__=code;');
          if (patch === before) throw new Error('Final evaluator pattern not found');
          vm.runInThisContext(patch);
          if (!globalThis.__JUN_FINAL_CODE__) throw new Error('Final source was not generated');
          fs.writeFileSync('debug-june-source/jun-app-final.js', globalThis.__JUN_FINAL_CODE__);
          NODE
          node /tmp/build-final.js

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-june-source
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract readable June app source"
          git push origin HEAD:agent/june-data-import
