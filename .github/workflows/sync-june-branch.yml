name: Sync June branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-june-branch.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main into June branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/june-data-import
          git checkout -B agent/june-data-import origin/agent/june-data-import
          git merge --no-edit origin/main
          git push origin HEAD:agent/june-data-import
