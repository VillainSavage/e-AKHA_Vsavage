name: Validate June PR

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
      - name: Build and syntax-check June application
        id: test
        shell: bash
        run: |
          cat > /tmp/test-june.js <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          try {
            global.window = { __JUN_APP_PARTS__: [], __JUN_LOADER_B64_PARTS__: [] };
            for (let i = 1; i <= 8; i++) vm.runInThisContext(fs.readFileSync(`jun-2026/part${String(i).padStart(2, '0')}.js`, 'utf8'));
            console.log('parts', window.__JUN_APP_PARTS__.length);
            vm.runInThisContext(fs.readFileSync('jun-2026/june-migration-seed-2026.js', 'utf8'));
            console.log('migration patch applied');
            vm.runInThisContext(fs.readFileSync('jun-2026/kzk-seed-june-2026.js', 'utf8'));
            console.log('kzk records', window.__EAKHA_JUNE_KZK_SEED__?.records?.length);
            for (let i = 1; i <= 7; i++) vm.runInThisContext(fs.readFileSync(`jun-2026/loader-b64-${String(i).padStart(2, '0')}.js`, 'utf8'));
            let patch = Buffer.from(window.__JUN_LOADER_B64_PARTS__.join(''), 'base64').toString('utf8');
            const before = patch;
            patch = patch.replace(/new Function\(code\)\(\);/g, 'globalThis.__JUNE_FINAL_SOURCE__=code;');
            if (patch === before) throw new Error('Loader evaluator marker not found');
            vm.runInThisContext(patch);
            const finalSource = globalThis.__JUNE_FINAL_SOURCE__;
            if (!finalSource) throw new Error('Final June source was not generated');
            new Function(finalSource);
            console.log('final source syntax OK', finalSource.length);
            console.log('has BOS', finalSource.includes('SNAPSHOT BOS — JUN 2026'));
            console.log('has migration', finalSource.includes('IMPORT_JUNE_LEGACY'));
            if (!finalSource.includes('SNAPSHOT BOS — JUN 2026') || !finalSource.includes('IMPORT_JUNE_LEGACY')) throw new Error('June completion markers missing');
            if (window.__EAKHA_JUNE_KZK_SEED__?.records?.length !== 52) throw new Error('KZ Koperal seed is not 52 members');
            const index = fs.readFileSync('jun-2026/index.html', 'utf8');
            const names = ['part08.js', 'june-migration-seed-2026.js', 'loader-b64-01.js', 'loader.js'];
            const positions = names.map(name => index.indexOf(name));
            if (positions.some(x => x < 0) || positions.some((x,i) => i && x < positions[i-1])) throw new Error('HTML load order invalid');
            console.log('load order OK');
          } catch (error) {
            console.error('VALIDATION_ERROR:', error && error.stack ? error.stack : error);
            process.exit(1);
          }
          NODE
          set +e
          node /tmp/test-june.js > /tmp/june-validation.txt 2>&1
          status=$?
          set -e
          cat /tmp/june-validation.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Comment validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_STATUS: ${{ steps.test.outputs.status }}
        shell: bash
        run: |
          if [ "$TEST_STATUS" = "0" ]; then verdict="✅ LULUS"; else verdict="❌ GAGAL"; fi
          {
            echo "### June completion validation: $verdict"
            echo '```'
            tail -40 /tmp/june-validation.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Fail when validation failed
        if: steps.test.outputs.status != '0'
        run: exit 1
