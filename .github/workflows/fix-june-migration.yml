name: Fix and validate June migration

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-june-migration.yml]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/june-data-import
          fetch-depth: 0
          show-progress: false

      - name: Move June completion injection after loader patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jun-2026/june-migration-seed-2026.js')
          t=p.read_text(encoding='utf-8')
          start=t.index('  function installJuneCompletion(){')
          end=t.rindex("  const injected='('+installJuneCompletion.toString()+')();\\n';")
          body=t[start:end]
          prefix="""(()=>{
            'use strict';
            const nativeFunction=globalThis.Function;
            const marker=\"if(sessionValid())bootApp().catch(e=>{console.error(e);showLogin()});else showLogin();\";

          """
          suffix=r"""  const injected='('+installJuneCompletion.toString()+')();\n';
            function compileFinal(args){
              const next=Array.from(args),i=next.length-1,src=String(next[i]||'');
              if(src.includes(marker)&&src.includes("const DB_NAME='eakha_june_2026_v1'")){
                const finalSource=src.replace(marker,injected+marker);
                next[i]=finalSource;
                globalThis.Function=nativeFunction;
                if(globalThis.window)window.Function=nativeFunction;
                if(globalThis.window&&window.__JUNE_CAPTURE_ONLY__){
                  window.__JUNE_FINAL_SOURCE__=finalSource;
                  return function(){};
                }
              }
              return Reflect.construct(nativeFunction,next,nativeFunction);
            }
            const wrappedFunction=new Proxy(nativeFunction,{
              construct(target,args){return compileFinal(args)},
              apply(target,thisArg,args){return compileFinal(args)}
            });
            globalThis.Function=wrappedFunction;
            if(globalThis.window)window.Function=wrappedFunction;
          })();
          """
          p.write_text(prefix+body+suffix,encoding='utf-8')
          PY
          node --check jun-2026/june-migration-seed-2026.js
          node --check jun-2026/loader.js

      - name: Run exact live script order
        id: validate
        shell: bash
        run: |
          cat > /tmp/test-june.js <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const NativeFunction=global.Function;
          try{
            global.window={__JUN_APP_PARTS__:[],__JUN_LOADER_B64_PARTS__:[],__JUNE_CAPTURE_ONLY__:true};
            vm.runInThisContext(fs.readFileSync('jun-2026/kzk-seed-june-2026.js','utf8'));
            for(let i=1;i<=8;i++)vm.runInThisContext(fs.readFileSync(`jun-2026/part${String(i).padStart(2,'0')}.js`,'utf8'));
            vm.runInThisContext(fs.readFileSync('jun-2026/june-migration-seed-2026.js','utf8'));
            for(let i=1;i<=7;i++)vm.runInThisContext(fs.readFileSync(`jun-2026/loader-b64-${String(i).padStart(2,'0')}.js`,'utf8'));
            vm.runInThisContext(fs.readFileSync('jun-2026/loader.js','utf8'));
            const src=window.__JUNE_FINAL_SOURCE__;
            if(!src)throw new Error('Final June source was not captured');
            NativeFunction(src);
            for(const x of ['SNAPSHOT BOS — JUN 2026','IMPORT_JUNE_LEGACY','JUNE-COMPLETE-20260709-1','Import Backup Lama Jun','applyJuneKzkSeed'])if(!src.includes(x))throw new Error(`Missing marker: ${x}`);
            if(window.__EAKHA_JUNE_KZK_SEED__?.records?.length!==52)throw new Error('KZK seed is not 52 members');
            const html=fs.readFileSync('jun-2026/index.html','utf8');
            const order=['kzk-seed-june-2026.js','part01.js','part08.js','june-migration-seed-2026.js','loader-b64-01.js','loader.js'];
            const pos=order.map(x=>html.indexOf(x));
            if(pos.some(x=>x<0)||pos.some((x,i)=>i&&x<pos[i-1]))throw new Error('HTML load order invalid');
            console.log(`PASS final source: ${src.length} chars`);
            console.log('PASS KZK: 52 anggota');
            console.log('PASS Snapshot BOS and legacy migration');
            console.log('PASS live loader and HTML order');
          }catch(e){console.error(e.stack||e);process.exit(1)}
          NODE
          set +e
          node /tmp/test-june.js >/tmp/june-result.txt 2>&1
          s=$?
          set -e
          cat /tmp/june-result.txt
          echo "status=$s" >> "$GITHUB_OUTPUT"

      - name: Commit tested files to working branch
        if: steps.validate.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jun-2026/june-migration-seed-2026.js jun-2026/loader.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix and validate June completion loader"
            git push origin HEAD:agent/june-data-import
          fi

      - name: Post result to PR 2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.validate.outputs.status }}
        shell: bash
        run: |
          [ "$TEST_STATUS" = 0 ] && verdict='✅ LULUS' || verdict='❌ GAGAL'
          { echo "### Final live-loader validation: $verdict"; echo '```'; cat /tmp/june-result.txt; echo '```'; } >/tmp/comment.md
          gh pr comment 2 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Fail on validation error
        if: steps.validate.outputs.status != '0'
        run: exit 1
