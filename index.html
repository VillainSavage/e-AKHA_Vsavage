<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>e-AKHA Vsavage v5.10.50 STABLE</title>
  <style>
    body{margin:0;background:#0a1628;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
    .box{max-width:560px;padding:28px;border:1px solid rgba(200,150,10,.35);border-radius:14px;background:#0f1f3d;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{font-size:18px;color:#f0b429;margin:0 0 8px}p{font-size:12px;color:rgba(255,255,255,.72);line-height:1.55}.err{color:#fca5a5;white-space:pre-wrap;text-align:left;font-size:11px;margin-top:12px}
  </style>
</head>
<body>
<div class="box">
  <h1>e-AKHA Vsavage</h1>
  <p>Memuatkan sistem stabil dan memasang fix kekal Mei 2026...</p>
  <p style="font-size:10px;color:rgba(255,255,255,.4)">Data dibaca daripada IndexedDB tempatan · Tiada Pulih Snapshot manual diperlukan</p>
  <div id="err" class="err"></div>
</div>
<script>
(function(){
'use strict';
var BASE_BLOB_SHA='ae323e025be6cff702e705eb662cb20d903dbe09';
var API='https://api.github.com/repos/VillainSavage/e-AKHA_Vsavage/git/blobs/'+BASE_BLOB_SHA;
function decodeB64(b64){
  b64=String(b64||'').replace(/\s+/g,'');
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
fetch(API+'?x='+Date.now(),{cache:'no-store'}).then(function(r){
  if(!r.ok)throw new Error('Gagal fetch base index: '+r.status);
  return r.json();
}).then(function(blob){
  var html=decodeB64(blob.content||'');
  if(!/e-AKHA Vsavage/i.test(html))throw new Error('Base bukan index e-AKHA');
  var patch='<script src="v51047-auto-idb.js?v=51050-'+Date.now()+'"><\\/script>';
  if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i, patch+'</body>');
  else html += patch;
  document.open();document.write(html);document.close();
}).catch(function(e){
  console.error(e);
  var el=document.getElementById('err');
  if(el)el.textContent='Gagal load sistem stabil. Screenshot error ini dan hantar.\n\n'+(e&&e.stack||e);
});
})();
</script>
</body>
</html>
